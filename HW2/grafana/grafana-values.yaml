datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server
        access: proxy
        isDefault: true
        uid: PBFA97CFB590B2093
      - name: Loki
        type: loki
        url: http://loki-gateway
        access: proxy
        isDefault: false
        uid: loki
        jsonData: 
          derivedFields:
            - name: jaeger1
              matcherRegex: '"trace_id":\s*"(\w+)"' 
              url: $${__value.raw}
              datasourceUid: jaeger
      - name: Jaeger
        type: jaeger
        url: http://jaeger:16686
        access: proxy
        isDefault: false
        uid: jaeger
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
dashboardsConfigMaps: 
  default: red-api-dashboard
