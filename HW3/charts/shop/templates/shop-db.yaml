apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-db
  labels:
    app: shop-db
    owner: team-a
spec:
  instances: {{ .Values.db.instances }}
  storage:
    size: {{ .Values.db.storageSize }}
  inheritedMetadata:
    labels:
      app: shop-db
      owner: team-a
  resources:
    limits:
      memory: {{ .Values.db.requests.memory }}
  imageName: {{ .Values.db.imageName }}

