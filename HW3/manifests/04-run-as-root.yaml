apiVersion: v1
kind: Pod
metadata:
  name: 04-run-as-root
  labels:
    app: shop-api
    owner: team-a
spec:
  containers:
    - name: myapp
      image: registry.local/shop-api:0.1.0
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: false
      resources:
        limits:
          memory: 128Mi 
