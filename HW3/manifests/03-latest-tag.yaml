apiVersion: v1
kind: Pod
metadata:
  name: 03-latest-tag
  labels:
    app: shop-api
    owner: team-a
spec:
  containers:
    - name: myapp
      image: registry.local/shop-api:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
      resources:
        limits:
          memory: 128Mi 
