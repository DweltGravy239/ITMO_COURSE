apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: limits-memory
spec:
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules: 
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['pods']
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: shop
  validations:
    - expression: "object.spec.containers.all(number, has(number.resources.limits) && has(number.resources.limits.memory))"
      message: "Лимит по памяти не задан"
