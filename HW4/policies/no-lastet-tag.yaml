apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-latest-tag
spec:
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['pods']
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: shop
  validations:
    - expression: "object.spec.containers.all(image, !image.image.endsWith(':latest'))"
      message: "В образе тег latest"
