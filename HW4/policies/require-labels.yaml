apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
spec:
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['pods']
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: shop
  validations:
    - expression: "has(object.metadata.labels) && 'app' in object.metadata.labels && 'owner' in object.metadata.labels"
      message: "Правильная метка не установлена!"
